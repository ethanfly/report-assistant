[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/icon-gen"]
exclude = ["src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["report-assistant contributors"]
repository = "https://github.com/ethanfly/report-assistant"

[workspace.dependencies]
# 异步与并发
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
parking_lot = "0.12"

# 错误处理
anyhow = "1.0"
thiserror = "1.0"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# 时间
chrono = { version = "0.4", features = ["serde"] }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# SQLite
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# 图像
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"

# Git
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }

# 文件 / 路径
dirs = "5.0"

# UUID / 随机
uuid = { version = "1.10", features = ["v4", "serde"] }

# 内部 crate
report-assistant-core = { path = "crates/core" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
