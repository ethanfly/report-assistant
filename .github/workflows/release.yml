name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform.os }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: windows-latest
            asset_name: report-assistant-${{ github.run_number }}-windows-x64
            tauri_target: x86_64-pc-windows-msvc
          - os: macos-latest
            asset_name: report-assistant-${{ github.run_number }}-macos-aarch64
            tauri_target: aarch64-apple-darwin
          - os: ubuntu-22.04
            asset_name: report-assistant-${{ github.run_number }}-linux-x64
            tauri_target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build frontend
        run: pnpm build

      - name: Build CLI
        shell: bash
        run: cargo build --release -p report-assistant-cli

      - name: Build Tauri
        shell: bash
        working-directory: src-tauri
        run: cargo build --release

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "artifacts/${{ matrix.platform.asset_name }}" -Force | Out-Null
          Copy-Item "src-tauri/target/release/report-assistant.exe" "artifacts/${{ matrix.platform.asset_name }}/小T日报助手.exe"
          Copy-Item "target/release/report-assistant.exe" "artifacts/${{ matrix.platform.asset_name }}/report-assistant-cli.exe"
          Compress-Archive -Path "artifacts/${{ matrix.platform.asset_name }}/*" -DestinationPath "artifacts/${{ matrix.platform.asset_name }}.zip"

      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "artifacts/${{ matrix.platform.asset_name }}"
          cp src-tauri/target/release/report-assistant "artifacts/${{ matrix.platform.asset_name }}/" || true
          cp target/release/report-assistant "artifacts/${{ matrix.platform.asset_name }}/report-assistant-cli" || true
          cd artifacts && zip -r "${{ matrix.platform.asset_name }}.zip" "${{ matrix.platform.asset_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.asset_name }}
          path: artifacts/${{ matrix.platform.asset_name }}.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: ver
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="v0.2.${{ github.run_number }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)" "${LAST_TAG}..HEAD")
          else
            LOG=$(git log --pretty=format:"- %s (%h)" -30)
          fi
          {
            echo "changelog<<EOF"
            echo "$LOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          body: |
            构建编号：${{ github.run_number }}
            提交：${{ steps.ver.outputs.short_sha }}

            ## 变更
            ${{ steps.changelog.outputs.changelog }}

            ## 下载
            解压 zip 后双击 `小T日报助手.exe`（Windows）或对应可执行文件运行；
            随包附带 `report-assistant-cli` 命令行工具。

            - **Windows**：`*-windows-x64.zip`
            - **macOS**：`*-macos-aarch64.zip`
            - **Linux**：`*-linux-x64.zip`
          files: artifacts/*.zip
          draft: false
          prerelease: false
          generate_release_notes: false
