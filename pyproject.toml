[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "report-assistant"
version = "0.1.0"
description = "AI-powered daily/weekly/monthly report generator from git commits and screenshots"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "report-assistant" }]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "Pillow>=10.0",
    "mss>=9.0",
    "python-dateutil>=2.8",
    "python-docx>=1.1",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-mock>=3.12"]
gui = ["PySide6>=6.6"]

[project.scripts]
report = "report_assistant.cli:main"
report-gui = "report_assistant.desktop.app:main"

[tool.setuptools.packages.find]
include = ["report_assistant*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"report_assistant.desktop.assets" = ["*.png", "*.ico"]
